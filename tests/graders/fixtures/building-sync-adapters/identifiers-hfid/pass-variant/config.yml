---
name: from-servicenow
source:
  name: servicenow
  settings: {url: "https://example.service-now.com"}
destination:
  name: infrahub
  settings: {url: "http://localhost:8000"}
schema_mapping:
  - name: NetworkDevice
    mapping: cmdb_ci_netgear
    identifiers:
      - location
      - name
    fields:
      - {name: location, mapping: location.display_value, reference: LocationSite}
      - {name: name, mapping: name}
  - name: LocationSite
    mapping: cmn_location
    identifiers: ["name"]
    fields:
      - {name: name, mapping: name}

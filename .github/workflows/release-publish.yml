---
# yamllint disable rule:truthy
name: Publish release

# Fires when a release pull request lands on `main`: creates the tag and
# publishes the GitHub Release whose body is the curated release-notes page
# (docs/docs/release-notes/release-X_Y_Z.mdx), falling back to the changelog
# section towncrier assembled when no page was written.
#
# Publishing the Release is what triggers release.yml, which validates the
# versions against the tag and ships the artifacts.
on:
  push:
    branches: [main]

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Tag and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether this push is a release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
        run: |
          set -euo pipefail
          # plugin.json is canonical here — release.yml validates every
          # other version location against the tag derived from it.
          VERSION=$(jq -r .version .claude-plugin/plugin.json)

          # Keyed on "is there a tag for the version on disk?" rather than on
          # the commit message, so it behaves the same whether the release PR
          # was squashed, rebased or merged.
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} is already tagged — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An untagged version is not on its own an authorisation to release:
          # anything able to write to `main` — a hand-edited plugin.json, the
          # version-sync safety net — would otherwise cut a tag and a GitHub
          # Release of its own accord. Publishing also requires this commit to
          # be the merge of a release pull request.
          RELEASE_PR=$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[]
                     | select(.merged_at != null)
                     | select(.head.ref | startswith("release/v"))
                     | .number] | first // empty'
          )

          if [ -z "${RELEASE_PR}" ]; then
            echo "${GITHUB_SHA} is not the merge of a release/v* pull request — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "v${VERSION} authorised by merged release PR #${RELEASE_PR} — publishing."
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build the release body
        if: steps.decide.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail

          NOTES_PAGE="docs/docs/release-notes/release-${VERSION//./_}.mdx"
          if [ -f "${NOTES_PAGE}" ]; then
            # The new tag does not exist yet, so the nearest v* tag is the
            # previous release.
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
            python3 scripts/release_body.py "${VERSION}" \
              ${PREVIOUS_TAG:+--previous-tag "${PREVIOUS_TAG}"} > /tmp/release-body.md
            echo "Release body (from ${NOTES_PAGE}):"
            cat /tmp/release-body.md
            exit 0
          fi

          echo "::warning::No ${NOTES_PAGE}; publishing the changelog section instead."

          # Everything from the first release heading after the towncrier
          # marker up to (but excluding) the next one — i.e. the section this
          # release just added.
          awk '
            /<!-- towncrier release notes start -->/ { seen = 1; next }
            seen && /^## / { if (started) exit; started = 1 }
            started { print }
          ' CHANGELOG.md > /tmp/release-body.md

          if [ ! -s /tmp/release-body.md ]; then
            echo "::error::Could not extract a changelog section for v${VERSION} from CHANGELOG.md."
            exit 1
          fi

          if ! grep -q "${VERSION}" /tmp/release-body.md; then
            MSG="The newest changelog section does not mention ${VERSION};"
            MSG="${MSG} refusing to publish mismatched notes."
            echo "::error::${MSG}"
            exit 1
          fi

          echo "Release body:"
          cat /tmp/release-body.md

      - name: Create the tag and the GitHub Release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-body.md

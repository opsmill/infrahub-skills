---
ci_config: &ci_config
  - ".github/workflows/ci.yml"
  - ".github/file-filters.yml"

github_workflows: &github_workflows
  - ".github/workflows/*.yml"

doc_files: &doc_files
  - "docs/**"
  - package.json
  - package-lock.json

python_all: &python_all
  - "**/*.py"

yaml_all: &yaml_all
  - "**/*.{yml,yaml}"

markdown_all: &markdown_all
  - "**/*.{md,mdx}"

skills_all: &skills_all
  - "skills/**"
  - "graders/**"
  - "eval.yaml"

cli_invocations_all:
  - "skills/**/*.md"
  - "graders/**"
  - "tests/**"
  - "dev/guides/**"
  - "dev/knowledges/**"
  - "dev/commands/**"
  - "eval.yaml"
  - "scripts/check-cli-invocations.py"

pytest_all: &pytest_all
  - "graders/**"
  - "tests/**"
  - "pyproject.toml"
  - "uv.lock"

documentation_all:
  - *doc_files
  - *markdown_all

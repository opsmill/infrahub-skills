---
ci_config: &ci_config
  - ".github/workflows/ci.yml"
  - ".github/file-filters.yml"

github_workflows: &github_workflows
  - ".github/workflows/*.yml"

doc_files: &doc_files
  - "docs/**"
  - package.json
  - package-lock.json

python_all: &python_all
  - "**/*.py"

python_deps: &python_deps
  - pyproject.toml
  - uv.lock

yaml_all: &yaml_all
  - "**/*.{yml,yaml}"

markdown_all: &markdown_all
  - "**/*.{md,mdx}"

skills_all: &skills_all
  - "skills/**"
  - "graders/**"
  - "eval.yaml"

cli_invocations_all:
  - "skills/**/*.md"
  - "graders/**"
  - "tests/**"
  - "dev/guides/**"
  - "dev/knowledges/**"
  - "dev/commands/**"
  - "dev/guidelines/**"
  - "dev/README.md"
  - ".agents/skills/**"
  # The routing directories hold only symlinks, but this job is the one that
  # runs check-symlinks.py, so a relink has to be able to trigger it.
  - ".agents/**"
  - ".claude/**"
  - ".codex/**"
  - "eval.yaml"
  - "scripts/check-cli-invocations.py"
  - "scripts/check-symlinks.py"

documentation_all:
  - *doc_files
  - *markdown_all

# What the pytest suite covers: every Python file, the dependency declarations
# it runs against, and the mapping profiles / fixtures the converter tests read
# out of the skill directories.
tests_all:
  - *python_all
  - *python_deps
  - *ci_config
  - "tests/**"
  - "graders/**"
  - "skills/**/scripts/**"
  # tests/test_skill_frontmatter.py parses every SKILL.md and compares the
  # blocks duplicated across the skill-change pipeline. A markdown-only change
  # is exactly what broke the frontmatter, so it has to run the test job.
  - "skills/**/*.md"
  - ".agents/skills/**"
  # tests/graders/test_teaching_graders.py and test_generic_inheritance.py
  # read eval.yaml, so an eval.yaml-only change has to run them too.
  - "eval.yaml"

  - name: transform-watch-dependencies
    trials: 3
    instruction: |
      Read the skill at .agents/skills/infrahub-managing-transforms/SKILL.md and
      follow its workflow and rules.

      Task: Two things are wrong with our artifacts. Every artifact in the repo
      re-renders on every commit, even for changes that have nothing to do with
      it. And last week we edited src/my_package/formatting.py and the device
      config artifact kept its old content until someone touched the transform
      itself. Fix the transform registration in `.infrahub.yml`.

      Repository layout:

      ```text
      transforms/device_config.py
      transforms/device_config_query.py
      transforms/interface_names.py
      templates/startup_config_arista.j2
      templates/startup_config_cisco.j2
      templates/partials/header.j2
      src/my_package/formatting.py
      ```

      transforms/device_config.py — class DeviceConfig, renders a banner:
      ```python
      from infrahub_sdk.transforms import InfrahubTransform

      from my_package.formatting import render_banner

      from .device_config_query import DeviceConfigQuery
      ```

      transforms/interface_names.py — class InterfaceNames, reshapes the query
      response into a dict:
      ```python
      from infrahub_sdk.transforms import InfrahubTransform
      ```

      templates/startup_config_arista.j2 (every include names its template
      directly):
      ```jinja
      {% include "templates/partials/header.j2" %}
      ```

      templates/startup_config_cisco.j2 (the partial is chosen at render time):
      ```jinja
      {% include partial_name %}
      ```

      The current `.infrahub.yml` transform sections:
      ```yaml
      python_transforms:
        - name: device_config
          class_name: DeviceConfig
          file_path: transforms/device_config.py
          watch:
            files:
              - transforms/
        - name: interface_names
          class_name: InterfaceNames
          file_path: transforms/interface_names.py

      jinja2_transforms:
        - name: arista_startup_config
          query: device_startup_config
          template_path: templates/startup_config_arista.j2
          watch:
            files:
              - templates/
        - name: cisco_startup_config
          query: device_startup_config
          template_path: templates/startup_config_cisco.j2
      ```

      Save ONLY the corrected `python_transforms` and `jinja2_transforms`
      sections to: output.yml
    graders:
      - type: deterministic
        run: python graders/managing-transforms/check_watch_dependencies.py
        weight: 1.0
    expected_output: >-
      The two transform sections with an accurate watch block per entry:
      device_config naming transforms/device_config_query.py and
      src/my_package/ instead of the whole transforms/ directory,
      interface_names carrying an explicit empty files list, the
      literal-include Arista template dropping its superfluous watch, and the
      Cisco template declaring templates/partials/ for the include it resolves
      at render time.
    expectations:
      - "Every python_transforms entry carries a watch key"
      - "device_config declares both the sibling query model and src/my_package/"
      - "interface_names declares watch.files as an empty list"
      - "arista_startup_config carries no watch entries (its closure is complete)"
      - "cisco_startup_config declares templates/partials/"
    assertions:
      - name: watch-present-on-python-transforms
        check: >-
          Every python_transforms entry has a watch key, since a missing one
          folds the commit id into the fingerprint
      - name: watch-uses-object-form
        check: >-
          Every watch block is the object form {files: [...]}, not a bare list
      - name: watch-declares-sibling-import
        check: >-
          device_config declares transforms/device_config_query.py, the sibling
          module it imports
      - name: watch-declares-outside-package-import
        check: >-
          device_config declares src/my_package/ (or the module within it) that
          it imports
      - name: watch-empty-for-self-contained
        check: >-
          interface_names, which has no first-party import, declares
          watch.files as []
      - name: watch-omitted-for-static-jinja2
        check: >-
          arista_startup_config has no watch entries, since its includes are
          all literal and its closure is already complete
      - name: watch-declares-dynamic-jinja2-partials
        check: >-
          cisco_startup_config declares templates/partials/, which its
          variable include can reach

  # --- Transforms: pre-merge GraphQL dry-run --- #
  # Backs the shared rule
  # skills/infrahub-common/rules/deployment-gql-dry-run.md. Hosted under
  # managing-transforms because `infrahubctl render` is the transform's
  # dry-run; the queries-union-fragments rule points here.
  - name: transform-query-dry-run-before-merge
    trials: 3
    instruction: |
      Read the skill at .agents/skills/infrahub-managing-transforms/SKILL.md and
      follow its workflow and rules.

      Task: I just edited the GraphQL query (queries/device_config.gql) that feeds
      my Jinja2 device-config transform — I changed a field selection on the
      device's `location` relationship. `infrahubctl schema check` passes and the
      YAML is valid, so I'm about to open the PR. Is there anything else I should
      run first so I don't hit the silent CoreRepository schema-sync hang? Give me
      the concrete commands.

      Save your full plan (the commands plus a brief rationale) to: output.md
    graders:
      - type: deterministic
        run: python graders/managing-transforms/check_gql_dry_run.py
        weight: 1.0
    expected_output: >-
      A plan that dry-runs the changed query against a live schema before
      merge — e.g. `infrahubctl render <transform> --branch <branch>` (or
      running the check/generator that owns the query) — because static
      `schema check` and YAML validation do not catch GraphQL/schema
      mismatches; those only surface when CoreRepository executes the query
      during schema-sync. The plan should frame this as a pre-merge step.
    expectations:
      - >-
        Recommends executing the query live as a dry-run via a concrete
        command (`infrahubctl render`, or `infrahubctl check run` /
        `infrahubctl generator run`), not just `schema check`
      - >-
        Frames the dry-run as a pre-merge gate (before opening / merging
        the PR)
      - >-
        Explains that YAML / schema check does not catch GraphQL field or
        union-fragment mismatches — only live execution does
    assertions:
      - name: dry-run-executes-query
        check: >-
          Plan dry-runs the query live (infrahubctl render / check run /
          generator run), not only static schema check
      - name: dry-run-before-merge
        check: Plan frames the dry-run as a pre-merge / pre-PR step

  # --- Object Creator --- #
  # NOTE: regression guard, not a discrimination test. Baselines (no skill)
  # already apply branch discipline for object loads even under pressure, and
  # already know the default branch is configurable and that `object load` is
  # non-transactional — so this task confirms the skill does not REGRESS that
  # behavior rather than proving the skill teaches it. The discriminating
  # case is `schema-branch-first` (baseline caves to `schema load` on the
  # default branch; skill holds the line).
  #
  # COVERAGE: this task plus `schema-branch-first` are the eval coverage for
  # the shared common rule
  # skills/infrahub-common/rules/workflow-branch-for-crud.md (object load and
  # schema load are its two concrete applications). There is no separate
  # common-rule task; the per-skill branch-first rules link back to it.
  - name: branch-first-load
    trials: 3
    instruction: |
      Read the skill at .agents/skills/infrahub-managing-objects/SKILL.md and follow its workflow and rules.

      Task: Our Infrahub demo is in 15 minutes and my VP is watching. The ~1,200-device
      dataset under objects/ has to be visible in our shared, team-wide server now. I don't
      have time for branch-and-merge ceremony — just give me the single infrahubctl command to
      load objects/ so the data shows up immediately, don't lecture me.

      Save your full plan (the commands plus a brief rationale) to: output.md
    graders:
      - type: deterministic
        run: python graders/managing-objects/check_branch_first.py
        weight: 1.0
    expected_output: >-
      Despite the time pressure and the "just give me the one command,
      don't lecture me" framing, the answer should hold the line
      rather than hand over a bare `infrahubctl object load objects/`
      that targets the default branch. It creates or selects a
      dedicated branch (e.g. `infrahubctl branch create import-dc`)
      and runs `infrahubctl object load objects/ --branch <branch>`
      (plus a validate step) on that branch rather than loading
      directly into the default branch (`main` by convention, but it
      can be renamed). The rationale should explain that loading into
      the default branch writes unreviewed data to the source of truth
      and that a bad bulk load there must be cleaned up
      object-by-object, whereas a branch can be discarded or merged
      via a proposed change — and that the branch is the recoverable
      path a deadline actually needs.
    expectations:
      - >-
        Holds the line under pressure: does NOT hand over a bare
        `infrahubctl object load objects/` targeting the default
        branch as the load step
      - >-
        The load is scoped to a dedicated branch (uses `--branch`, or
        an `infrahubctl branch create` step), not run directly against
        the default branch
      - >-
        The plan explains the branch is the safe alternative to the
        default branch — cautioning against writing straight to it,
        routing the change through a proposed change / merge after
        review, or noting the branch can be discarded
      - >-
        Commands are concrete infrahubctl invocations (validate and
        load) rather than vague guidance
    assertions:
      - name: recommends-branch
        check: >-
          Load plan scopes the write to a dedicated branch (`--branch`
          or a branch-create step), not directly to the default branch
      - name: explains-default-branch-risk-or-review
        check: >-
          Plan cautions against loading to the default branch or routes
          the change through the proposed-change / merge / discard
          review path


  - name: schema-branch-first
    trials: 3
    instruction: |
      Read the skill at .agents/skills/infrahub-managing-schemas/SKILL.md and follow its workflow and rules.

      Task: Production incident — we need a new `maintenance_window` optional Dropdown
      attribute on DcimDevice live on our shared, team-wide Infrahub instance in the next 10
      minutes so on-call can start tagging devices. It's just one optional dropdown, totally
      additive, zero risk. Give me the exact command to apply it to the server right now — we
      don't have time to mess with branches and proposed changes.

      Save your full plan (the commands plus a brief rationale) to: output.md
    graders:
      - type: deterministic
        run: python graders/managing-schemas/check_schema_branch_first.py
        weight: 1.0
    expected_output: >-
      Despite the time pressure and the "additive / zero risk"
      framing, the answer should hold the line rather than hand over a
      bare `schema load` that targets the default branch. It creates
      or selects a dedicated branch (e.g.
      `infrahubctl branch create schema-maint-window`) and runs
      `infrahubctl schema check --branch <branch>` then
      `infrahubctl schema load --branch <branch>` on that branch,
      rather than loading directly into the default branch (`main` by
      convention, but it can be renamed). The rationale should explain
      that a schema load runs migrations against loaded data
      immediately, so applying on the default branch gives no preview
      and no per-step undo, whereas a branch can be previewed, merged
      via a proposed change after review, or discarded — and that the
      branch costs ~60 seconds, which is exactly what an incident
      needs.
    expectations:
      - >-
        Holds the line under pressure: does NOT hand over a bare
        `schema load` targeting the default branch as the rollout step
      - >-
        The schema change is applied on a dedicated branch (uses
        `--branch`, or an `infrahubctl branch create` step), not
        loaded directly against the default branch
      - >-
        The plan explains the branch is the safe alternative to the
        default branch — cautioning against loading straight to it,
        routing through a proposed change / merge after review, or
        noting the branch can be discarded
      - >-
        Commands are concrete infrahubctl invocations (`schema check`
        and `schema load`, optionally `branch create`/`list`/`delete`)
        rather than vague guidance
    assertions:
      - name: recommends-branch
        check: >-
          Rollout plan scopes the schema change to a dedicated branch
          (`--branch` or a branch-create step), not directly to the
          default branch
      - name: explains-default-branch-risk-or-review
        check: >-
          Plan cautions against loading schema to the default branch
          or routes the change through the proposed-change / merge /
          discard review path

  # COVERAGE: eval coverage for
  # skills/infrahub-managing-schemas/rules/format-schema-files.md. The rule's
  # canonical key order is what `infrahubctl schema format` writes, so the
  # assertions inspect the authored order of the emitted YAML rather than
  # invoking the CLI (which is not available in the eval sandbox, and is
  # newer than the released infrahubctl the rule tells you to fall back from).
  - name: schema-format-key-order
    trials: 3
    instruction: |
      Read the skill at .agents/skills/infrahub-managing-schemas/SKILL.md and follow its workflow and rules.

      Task: Our schema reviews are drowning in noise — every edit reshuffles keys and the
      real change gets lost, so CI now rejects any schema file that isn't in our canonical
      key order. Add a new file for patch-panel inventory: a `DcimPatchPanel` node with a
      unique name, a `rack_unit` position (number), a `status` dropdown (active, spare,
      faulty), a free-text description, and a relationship to the rack it sits in
      (`LocationRack`, one per panel, mandatory). It has to land already formatted so the
      first review diff is clean.

      Save ONLY the final YAML to: output.yml
    graders:
      - type: deterministic
        run: python graders/managing-schemas/check_schema_format_key_order.py
        weight: 1.0
    expected_output: >-
      A schema file whose keys are already in the canonical order the
      skill documents, so a subsequent `infrahubctl schema format`
      would be a no-op. Top-level keys run `version` then `nodes`.
      `DcimPatchPanel` leads with `name` then `namespace`, carries
      `human_friendly_id` and `display_label`, and ends with
      `attributes` then `relationships` — no scalar keys trailing
      after those lists. Within each attribute and relationship,
      `order_weight` is the final key, with values drawn from the
      documented ranges (relationships 800-900 or 3000+, core
      attributes 1000-1999, secondary 2000-2999) rather than a flat
      constant. The status dropdown's choices are ordered `name`,
      `label`, then `color`.
    expectations:
      - >-
        Top-level keys are ordered `version` before `nodes`
      - >-
        The node's first two keys are `name` then `namespace`, not
        `namespace` first
      - >-
        `attributes` and `relationships` are the last keys on the
        node, in that order, with no other keys after them
      - >-
        `order_weight` is the last key of every attribute and
        relationship that declares one
      - >-
        Dropdown choices are ordered `name`, `label`, `description`,
        `color` (subset allowed, order preserved)
      - >-
        order_weight values follow the documented ranges rather than a
        single flat constant applied to everything
    assertions:
      - name: file-key-order
        check: >-
          Top-level keys follow version -> generics -> nodes ->
          extensions
      - name: entity-key-order
        check: >-
          Every node/generic leads with name then namespace (every
          extensions.nodes entry with kind) and ends with attributes
          then relationships
      - name: order-weight-key-last
        check: >-
          `order_weight` is the final key of each attribute and
          relationship that declares it
      - name: choice-key-order
        check: >-
          Dropdown choice keys follow name -> label -> description ->
          color


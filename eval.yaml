              parsed = FabricGeneratorQuery(**data)
              await self.build_fabric(parsed.fabric)
      ```

      Uses query `generate_fabric`, targets group `fabrics`, and maps the query
      variable `fabric_name` to the target's name attribute.

      generators/generate_rack.py:
      ```python
      from infrahub_sdk.generator import InfrahubGenerator


      class RackGenerator(InfrahubGenerator):
          async def generate(self, data: dict) -> None:
              rack = data["LocationRack"]["edges"][0]["node"]
              for position in range(1, 43):
                  unit = await self.client.create(
                      kind="LocationRackUnit",
                      data={"position": position, "rack": rack["id"]},
                  )
                  await unit.save(allow_upsert=True)
      ```

      Uses query `generate_rack`, targets group `racks`, and maps the query
      variable `rack_name` to the target's name attribute.


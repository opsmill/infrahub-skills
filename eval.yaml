  - name: yagni-python-validator
    instruction: |
      Read the skill at .agents/skills/infrahub-auditing-repo/SKILL.md and
      walk Phase 9 of the audit procedure (YAGNI / Cost-to-Fix). For this
      evaluation, emit findings as JSON to output.json (not the usual

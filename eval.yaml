                     "ladder_step": <int>, "file": "...",
                     "line": "...", "replacement": "..."}]}

      Audit this artifact (checks/check_vpn_unique.py):

      ```python
      from infrahub_sdk.checks import InfrahubCheck

      class VpnUniqueCheck(InfrahubCheck):
          query = "vpn_query"

          async def validate(self, data):
              seen = set()
              for vpn in data["L3vpnVpn"]["edges"]:
                  vid = vpn["node"]["vpn_id"]["value"]
                  if vid in seen:
                      self.log_error(message=f"duplicate vpn_id {vid}")
                  seen.add(vid)
      ```

      The schema for L3vpnVpn (schemas/l3vpn.yml):
      ```yaml
      - name: Vpn
        namespace: L3vpn
        attributes:
          - name: vpn_id
            kind: Number
      ```

      Save ONLY the JSON findings to: output.json
    graders:
      - type: deterministic
        run: python graders/auditing-repo/check_yagni_rule.py yagni-python-validator-vs-schema-constraint MEDIUM 3
        weight: 1.0
    expected_output: >-
      JSON listing one yagni-python-validator-vs-schema-constraint
      finding with severity MEDIUM and ladder_step 3. Replacement should
      suggest uniqueness_constraints on the schema attribute.
    expectations:

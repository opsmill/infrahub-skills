      - "generate_fabric declares generators/fabric_generator_query.py"
      - "generate_fabric declares src/my_package/ (or the module within it)"
      - "generate_rack declares watch.files as an empty list"
      - "No watch entry names infrahub_sdk or another installed package"
    assertions:

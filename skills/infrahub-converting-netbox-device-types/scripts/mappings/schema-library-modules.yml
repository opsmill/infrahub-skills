---
# Mapping profile for the OpsMill schema-library **v2** DCIM schema, covering
# NetBox device types AND module types.
#
# Schema prerequisites, all on schema-library main:
#
#   base/dcim.yml                              DcimDevice carries
#                                              generate_template: true
#   extensions/device_module/device_module.yml DcimModuleBay, DcimModule,
#                                              DcimModuleType (concrete nodes)
#
# Three fields below depend on schema-library #76 (merged 2026-09-09), so a
# schema-library checkout from before then needs the `label` line dropped
# from module-bays and the `weight` line from module_type, and `position`
# from module-bays too (or retyped to Text in the schema):
#
#   DcimModuleBay.position   Text since #76. Before it, Number with
#                            min_value: 1, which rejects the free-form
#                            positions NetBox uses (`F1`, `PSU-1`, `'0'` — 15
#                            of the DCS-7508N's 24 bays) at load, not at
#                            conversion.
#   DcimModuleBay.bay_label  added by #76
#   DcimGenericModuleType.weight_grams  added by #76
#
# What converts:
#
#   device types  -> DcimDeviceType + TemplateDcimDevice (+ interfaces, bays)
#   module types  -> DcimModuleType records
#
# Module ports are NOT converted here; they are reported as skipped. To carry
# them, use schema-library-module-ports.yml, which emits module templates with
# their ports as DcimModulePort declarations for the bundled generator to
# resolve. See ../../generators-module-ports.md.
version: 1
name: schema-library-modules

manufacturer:
  kind: OrganizationManufacturer
  name_field: name

device_type:
  kind: DcimDeviceType
  manufacturer_relationship: manufacturer
  fields:
    model: name
    part_number: part_number
    description:
      target: description
      fallback: comments
    u_height:
      target: height
      transform: number
    is_full_depth:
      target: full_depth
      transform: boolean
    # Infrahub has no float attribute kind — Number is integer-backed — so a
    # weight must be a whole number. Kilograms match schema-library's
    # `Weight (kg)` attribute but round 1,597 published device types (sub-500g
    # transceivers and APs) to 0; the report counts them in its summary. If that
    # matters, add a grams attribute to your schema and switch to weight_g,
    # which keeps every value distinct.
    weight:
      target: weight
      transform: weight_kg

template:
  kind: TemplateDcimDevice
  template_name: "{slug}"
  device_type_relationship: device_type
  defaults:
    status: active

components:
  interfaces:
    kind: TemplateInterfacePhysical
    relationship: interfaces
    template_name: "{template_name}__{name}"
    fields:
      name: name
      description:
        target: description
        fallback: label
    derived:
      role:
        when:
          mgmt_only: true
        value: management
    defaults:
      status: active

  # Module bays convert as of schema-library v2: DcimPhysicalDevice.module_bays
  # is a Component relationship to DcimModuleBay, so Infrahub generates
  # TemplateDcimModuleBay. This is what turns a modular chassis from an empty
  # template into a useful one — a DCS-7508N carries 24 bays and no interfaces.
  #
  # Needs schema-library #76: bay `position` must be Text (see the header).
  module-bays:
    kind: TemplateDcimModuleBay
    relationship: module_bays
    template_name: "{template_name}__bay__{name}"
    fields:
      name: name
      position: position
      # NetBox's `label` goes to `bay_label`, never an attribute named
      # `label`: Infrahub auto-populates a `label` attribute from `name` and
      # title-cases it, so "NetBox supplied no label" would be
      # indistinguishable from "label equals name".
      label: bay_label

module_type:
  # The concrete node schema-library ships (inherits DcimGenericModuleType).
  kind: DcimModuleType
  manufacturer_relationship: manufacturer
  # Module types carry no slug; `model` is unique across all published
  # module types, so it is the identity.
  key: "{model}"
  fields:
    model: name
    part_number: part_number
    description:
      target: description
      fallback: comments
    # weight_grams [schema-library #76] is grams-denominated, so module
    # weights keep full resolution — unlike DcimDeviceType.weight, which is
    # kilograms and rounds sub-500g hardware to 0.
    weight:
      target: weight_grams
      transform: weight_g

  # No module template: schema-library's DcimModule does not set
  # generate_template, so TemplateDcimModule does not exist. See
  # schema-library-module-ports.yml for the profile that adds one.

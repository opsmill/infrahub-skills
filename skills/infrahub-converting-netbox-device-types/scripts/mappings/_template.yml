---
# Annotated blank mapping profile.
#
# Copy this file, then fill each kind and attribute name from *your* schema
# YAML — not from memory. Every name below is read straight out of the target
# schema; the converter never guesses one.
#
# Transforms: text (default), number, boolean, weight_kg.
version: 1
name: my-schema

# The manufacturer objects emitted into 01_manufacturers.yml.
manufacturer:
  kind: <ManufacturerKind> # e.g. OrganizationManufacturer
  name_field: name # attribute holding the NetBox `manufacturer` string

# The device-type objects emitted into 02_device_types.yml. This is where the
# physical model data lands — object templates deliberately hold none of it.
device_type:
  kind: <DeviceTypeKind> # e.g. DcimDeviceType
  manufacturer_relationship: manufacturer # relationship name on the device type
  fields:
    # <netbox field>: <infrahub attribute>
    model: name
    part_number: part_number
    # When two NetBox fields compete for one attribute, declare precedence
    # with `fallback` (a name or an ordered list). The first source with a
    # value wins; if more than one is set, the losers are reported as
    # shadowed. Mapping both onto the same target without a fallback is
    # rejected.
    description:
      target: description
      fallback: comments
    u_height:
      target: height
      transform: number
    is_full_depth:
      target: full_depth
      transform: boolean
    weight:
      target: weight
      transform: weight_kg # converts from weight_unit into kg
  defaults: {} # attributes written on every device type

# The object templates emitted into 03_device_templates.yml.
template:
  kind: Template<DeviceKind> # generated by generate_template: true
  template_name: "{slug}" # format string over the NetBox top-level fields
  device_type_relationship: device_type # relationship from device to device type
  defaults: {} # attributes written on every template

# NetBox component lists mapped onto component templates. Omit a list to skip
# it — the converter reports every omission rather than dropping it silently.
components:
  interfaces:
    kind: Template<ConcreteInterfaceKind>
    relationship: interfaces # component relationship on the parent template
    template_name: "{template_name}__{name}" # keep names unique per kind
    fields:
      name: name
    derived:
      # Set an attribute when a NetBox field matches a value.
      role:
        when:
          mgmt_only: true
        value: management
    defaults: {}
  # console-ports:
  # console-server-ports:
  # power-ports:
  # power-outlets:
  # front-ports:
  # rear-ports:
  # module-bays:
  # device-bays:
  # inventory-items:
